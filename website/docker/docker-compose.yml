version: '3.8'
services:
  cms-website:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cms-website
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://coffeemanagementsuite.com
      - NEXT_PUBLIC_APP_URL=https://app.coffeemanagementsuite.com
      - NEXT_PUBLIC_SANITY_PROJECT_ID=${SANITY_PROJECT_ID}
      - NEXT_PUBLIC_SANITY_DATASET=production
      - SANITY_API_TOKEN=${SANITY_API_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NEXT_PUBLIC_PLAUSIBLE_DOMAIN=coffeemanagementsuite.com
    networks:
      - cms-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cms-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - cms-website
    networks:
      - cms-net

networks:
  cms-net:
    driver: bridge
